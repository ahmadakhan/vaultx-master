global:
  resolve_timeout: 5m

route:
  receiver: vaultx-webhook
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: vaultx-log-only
  - name: vaultx-webhook
    webhook_configs:
      - url: "${ALERTMANAGER_WEBHOOK_URL}"
        send_resolved: true
