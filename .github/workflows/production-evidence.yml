name: Production evidence

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_RLS_TEST_DATABASE_URL: postgresql+asyncpg://rls_runtime:rls_runtime_password@127.0.0.1:5432/rls_test
      REQUIRE_PG_RLS_TESTS: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Create constrained RLS test database
        env:
          PGPASSWORD: postgres
        run: >-
          psql --host 127.0.0.1 --username postgres --dbname postgres
          --command "CREATE ROLE rls_runtime LOGIN PASSWORD 'rls_runtime_password' NOSUPERUSER NOBYPASSRLS;"
          && psql --host 127.0.0.1 --username postgres --dbname postgres
          --command "CREATE DATABASE rls_test OWNER rls_runtime;"
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    name: Frontend type, lint, build, and security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:security
      - run: pnpm test:crypto
      - run: pnpm exec node --test tests/*.test.cjs
      - run: pnpm audit --audit-level high
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  mobile-android:
    name: Android adapter build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # This repository intentionally has no wrapper. setup-gradle installs and
      # verifies the exact Gradle toolchain used by this library project.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle --no-daemon :vaultx-transfer:assemble :vaultx-transfer:compileDebugKotlin

  mobile-ios:
    name: iOS adapter toolchain validation
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift package dump-package
      - run: swift build
